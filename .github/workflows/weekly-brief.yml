# Weekly investment theme brief — Monday schedule + manual trigger.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   GEMINI_API_KEY  — Google AI Studio
#   — or OPENAI_API_KEY only:
#       gsk_...     Groq (auto: api.groq.com + llama-3.3-70b-versatile)
#       sk-or-...   OpenRouter (auto: openrouter.ai + :free model)
#       sk-...      OpenAI (api.openai.com + gpt-4o)
# Optional: OPENAI_BASE_URL, OPENAI_MODEL, GEMINI_MODEL, FINNHUB_API_KEY, MARKET_REGION

name: Weekly theme brief

on:
  schedule:
    # Monday 06:00 UTC (08:00 CET / 09:00 CEST)
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      region:
        description: MARKET_REGION override
        required: false
        default: global
        type: choice
        options:
          - global
          - US
          - China
          - Europe
          - Japan

concurrency:
  group: weekly-brief
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Run 3-agent pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MARKET_REGION: ${{ github.event.inputs.region || secrets.MARKET_REGION || 'global' }}
          RESUME_CHECKPOINT: "1"
        run: |
          set -euo pipefail
          invest-themes -o reports/latest.json
          echo "Run complete. Archive under reports/runs/:"
          ls -la reports/runs/ 2>/dev/null | tail -5 || true

      - name: Publish Markdown report to repo
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from investment_agent.report_markdown import save_github_brief_reports
          from investment_agent.storage import load_brief

          brief = load_brief(Path("reports/latest.json"))
          if brief is None:
              raise SystemExit("reports/latest.json missing after pipeline run")
          latest, archive = save_github_brief_reports(brief)
          json_path = Path("brief/latest.json")
          print(f"Markdown: {latest}")
          print(f"Archive:  {archive}")
          print(f"JSON:     {json_path} exists={json_path.is_file()}")
          PY

      - name: Commit brief to repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brief/
          if git diff --staged --quiet; then
            echo "No brief changes to commit."
          else
            git commit -m "chore: update investment brief [skip ci]"
            git push
          fi

      - name: Upload brief artifacts
        uses: actions/upload-artifact@v4
        with:
          name: investment-brief-${{ github.run_id }}
          path: |
            reports/latest.json
            reports/runs/
          retention-days: 90
          if-no-files-found: error
