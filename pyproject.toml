[project]
name = "investment-agent"
version = "0.1.0"
description = "Multi-agent investment theme analyzer (Regime + Narrative + Markets, v2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "yfinance>=0.2.40",
    "streamlit>=1.32.0",
    "httpx>=0.27.0",
]

[project.scripts]
invest-themes = "investment_agent.cli:main"
invest-dashboard = "investment_agent.cli:dashboard_main"
invest-portfolio = "investment_agent.portfolio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investment_agent"]
